id: "kit-react"

project:
  name: "Rolder UI Kit for React"
  description: "Rolder UI Kit for React"

tasks:
  check:
    command: "biome check --write"
    inputs:
      - "./src/**/*"
  build:
    command: "rslib build"
    inputs:
      - "./src/**/*"
    outputs:
      - "./dist"
  publish:
    command: "bun publish"
    deps:
      - build
    local: true
