id: "showcase"

tags:
  - showcase

project:
  name: "Showcase"
  description: "Rolder UI Kit showcase"

tasks:
  check:
    command: "biome check --write ./src"
    inputs:
      - "./src/**/*"
  dev:
    command: "vite dev"
  build:
    command: "vite build"
    inputs:
      - "./src/**/*"
    outputs:
      - "./dist/**/*"
  start:
    command: "bun server.ts"
